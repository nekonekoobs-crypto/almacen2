name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk "salida/OT_TRACSA.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: OT_TRACSA
          path: salida/OT_TRACSA.apk
